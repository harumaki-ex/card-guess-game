<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>16模様カード当てゲーム v6</title></head>
<body style="background:#111827;color:white;font-family:sans-serif;padding:20px">
<h1>🃏16模様カード当てゲーム v6</h1>
<p>同じ模様が揃ったら、自分と相手のカードを両方消去します。</p>
<button onclick="start()">CPU対戦</button>
<div id="game"></div><div id="log"></div>
<script>
const marks=["★","◆","●","▲","■","♥","♠","♣","☀","☾","✿","❖","☘","⚡","☯","∞"];
let hand=[],enemy=[],deck=[],score=0;

function start(){
 deck=marks.flatMap(x=>[x,x]).sort(()=>Math.random()-.5);
 hand=deck.splice(0,4);enemy=deck.splice(0,4);score=0;
 autoCheck();draw();
}
function autoCheck(){
 let used=[];
 for(let i=0;i<hand.length;i++){
  if(hand.filter(x=>x===hand[i]).length>1) used.push(hand[i]);
  else if(enemy.includes(hand[i])) used.push(hand[i]);
 }
 used=[...new Set(used)];
 used.forEach(x=>{
   let a=hand.indexOf(x);
   if(a>=0) hand.splice(a,1);
   let b=enemy.indexOf(x);
   if(b>=0) enemy.splice(b,1);
   score++;
   log(x+"が揃った！自分と相手のカードを両方消去 +1点");
 });
}
function draw(){
 game.innerHTML="得点:"+score+"<br>自分の手札:";
 hand.forEach(x=>{game.innerHTML+=" "+x});
 game.innerHTML+="<br>相手の手札:"+enemy.length+"枚";
}
function log(x){document.getElementById("log").innerHTML+="<p>"+x+"</p>"}
</script>
</body></html>
